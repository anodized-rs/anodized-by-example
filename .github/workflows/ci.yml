name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        example: [e01, e02]
    steps:
      - uses: actions/checkout@v4
      - name: Install Aeneas and Charon
        run: ./scripts/aeneas-install.sh "${{ matrix.example }}"
      - name: Regenerate translations
        run: ./scripts/aeneas-translate.sh "${{ matrix.example }}"
      - name: Check translations are current
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --stat
            echo '::error::Translations are stale; run the translation script for the affected example and commit the result.'
            exit 1
          fi
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        working-directory: ${{ matrix.example }}
        run: lake exe cache get
      - name: Build translations and proofs
        working-directory: ${{ matrix.example }}
        run: lake build
